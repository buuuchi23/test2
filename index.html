<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>育休中意識高めよう委員会</title>
  <meta name="description" content="なりたい姿に向けて、毎日のやりたいことをゆるっと続けるアプリ">
  <meta name="theme-color" content="#fff7f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1f1b18" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="意識高め委員会">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1 id="screen-title">育休中意識高めよう委員会</h1>
  </header>

  <main id="view" class="view" tabindex="-1">
    <p class="loading">よみこみ中…</p>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="メインメニュー">
    <a href="#/today" data-tab="today"><span class="tab-icon" aria-hidden="true">☀️</span><span>今日</span></a>
    <a href="#/list" data-tab="list"><span class="tab-icon" aria-hidden="true">📝</span><span>リスト</span></a>
    <a href="#/record" data-tab="record"><span class="tab-icon" aria-hidden="true">📅</span><span>記録</span></a>
    <a href="#/settings" data-tab="settings"><span class="tab-icon" aria-hidden="true">⚙️</span><span>設定</span></a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="update-banner" class="update-banner" hidden>
    <span>新しいバージョンがあります</span>
    <button type="button" id="update-btn" class="btn btn-small">更新する</button>
  </div>

  <noscript>このアプリを使うには JavaScript を有効にしてください。</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
